<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>SVG Viewer</title>

        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #222;
                overflow: hidden;
            }

            #viewer {
                width: 100%;
                height: 100%;
                cursor: grab;
                overflow: hidden;
                position: relative;
            }

            #status-banner {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                padding: 12px 20px;
                box-sizing: border-box;
                font-family: monospace;
                font-size: 14px;
                font-weight: bold;
                text-align: center;
                letter-spacing: 0.03em;
            }

            #status-banner.error {
                display: block;
                background: #c0392bef;
                color: #fff;
            }

            #status-banner.ok {
                display: block;
                background: #27ae60;
                color: #fff;
                animation: fadeout 2s forwards;
                animation-delay: 2s;
            }

            @keyframes fadeout {
                to { opacity: 0; display: none; }
            }

            #viewport {
                transform-origin: 0 0;
            }
        </style>
    </head>
    <body>
        <div id="status-banner"></div>
        <button onclick="
          const layers = document.getElementById('svgHost').querySelectorAll('#layer-locks');
          const on = layers[0].style.display === 'none';
          layers.forEach(l => l.style.display = on ? '' : 'none');
          this.style.opacity = on ? '1' : '0.4';
        " style="position:fixed;top:12px;left:12px;z-index:50;
          background:rgba(30,30,30,0.85);border:1px solid #555;color:#eee;
          border-radius:6px;padding:5px 10px;font-size:24px;cursor:pointer;
          backdrop-filter:blur(4px)">
          Locks
        </button>
        <div id="viewer">
            <div id="viewport">
                <div id="svgHost"></div>
            </div>
        </div>

        <script>
            // Get the current host and port dynamically
            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const host = window.location.host; // includes hostname:port if non-default
            
            // Build URL
            const wsUrl = `${protocol}://${host}/ws`;
            
            /* ---------- GET ID FROM URL ---------- */
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id") || 0;
            const evtSource = new EventSource("/events");
            const ws = new WebSocket("ws://127.0.0.1:8000/ws");

            /* ---------- STATE ---------- */
            let scale = 1;
            let tx = 0;
            let ty = 0;
            let dragging = false;
            let lastX = 0;
            let lastY = 0;

            const viewer = document.getElementById("viewer");
            const viewport = document.getElementById("viewport");
            const svgHost = document.getElementById("svgHost");

            function applyTransform() {
                viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            }

            /* ---------- PAN ---------- */
            viewer.addEventListener("mousedown", (e) => {
                dragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });

            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                tx += e.clientX - lastX;
                ty += e.clientY - lastY;
                lastX = e.clientX;
                lastY = e.clientY;
                applyTransform();
            });

            window.addEventListener("mouseup", () => {
                dragging = false;
            });

            /* ---------- ZOOM ---------- */
            viewer.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();

                    const rect = viewer.getBoundingClientRect();

                    // Mouse position relative to viewport
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;

                    // Old scale
                    const oldScale = scale;

                    // Update scale
                    scale *= e.deltaY < 0 ? 1.1 : 0.9;

                    // Clamp scale to reasonable values
                    scale = Math.max(0.1, Math.min(10, scale));

                    // Adjust translation so the point under the mouse stays stationary
                    tx -= (mx - tx) * (scale / oldScale - 1);
                    ty -= (my - ty) * (scale / oldScale - 1);

                    applyTransform();
                },
                { passive: false },
            );
            
            const statusBanner = document.getElementById("status-banner");

            function showError(message) {
                statusBanner.className = "error";
                statusBanner.innerHTML = message || "Unknown error";
            }

            function clearError() {
                statusBanner.className = "";
                statusBanner.textContent = "";
            }

            function applyFrame(data, ignore_id) {
                if (data.error) {
                    showError(data.error);
                } else if (data.svg) {
                    clearError();
                    console.log(data.id)
                    if (ignore_id || data.id == id)
                      svgHost.innerHTML = data.svg;
                }
            }

            ws.onmessage = (event) => {
                applyFrame(JSON.parse(event.data), false);
            };

            async function poll() {
                const res = await fetch(`/current_frame/${encodeURIComponent(id)}`);
                if (!res.ok) return;
                const data = JSON.parse(await res.text());
                applyFrame(data, true);
            }

            poll();
        </script>
    </body>
</html>
